name: Development Land Area Read-Only Evidence Capture

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Repository-approved development target
        required: true
        type: choice
        default: mia-seven-full-278-official-components-api-readonly-20260729
        options:
          - mia-seven-full-278-official-components-api-readonly-20260729
          - mia-seven-full-299-api-readonly-20260728
          - mia-seven-auto-286-20260725
          - mia-seven-auto-76-20260725
          - mia-seven-parcel-singleton-202-20260725
          - mia-seven-review-210-20260725
          - mia-seven-791-2280-ldareg-api-readonly-20260725
          - mia-seven-full-278-official-components-api-readonly-production-20260812
          - mia-seven-standard-267-api-readonly-production-20260812
          - solsam-full-1086-api-readonly-production-20260904
          - solsam-standard-a-851-api-readonly-production-20260904
          - solsam-standard-b-101-api-readonly-production-20260904
          - solsam-g1-40-api-readonly-production-20260907

permissions:
  contents: read

concurrency:
  group: development-land-area-readonly-evidence
  cancel-in-progress: false

jobs:
  capture:
    name: Capture development evidence without DB writes
    runs-on: ubuntu-latest
    environment: land-area-sync-development-backfill
    timeout-minutes: 90
    steps:
      - name: Require approved main revision
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Development evidence capture must run from refs/heads/main."
            exit 1
          fi

      - name: Checkout exact revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Test and compile capture
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run build

      - name: Resolve repository-approved target
        id: manifest
        shell: bash
        env:
          MANIFEST_NAME: ${{ inputs.manifest }}
        run: |
          set -euo pipefail
          case "${MANIFEST_NAME}" in
            mia-seven-full-278-official-components-api-readonly-20260729)
              target_path="development-land-area-sync-manifests/mia-seven-full-278-official-components-api-readonly-target-20260729.json"
              target_count="278"
              property_unit_count="422"
              ;;
            mia-seven-full-299-api-readonly-20260728)
              target_path="development-land-area-sync-manifests/mia-seven-full-299-api-readonly-target-20260728.json"
              target_count="299"
              property_unit_count="429"
              ;;
            mia-seven-auto-286-20260725)
              target_path="development-land-area-sync-manifests/mia-seven-auto-286-target-20260725.json"
              target_count="286"
              property_unit_count="328"
              ;;
            mia-seven-auto-76-20260725)
              target_path="development-land-area-sync-manifests/mia-seven-auto-76-target-20260725.json"
              target_count="76"
              property_unit_count="76"
              ;;
            mia-seven-parcel-singleton-202-20260725)
              target_path="development-land-area-sync-manifests/mia-seven-parcel-singleton-202-target-20260725.json"
              target_count="202"
              property_unit_count="202"
              ;;
            mia-seven-review-210-20260725)
              target_path="development-land-area-sync-manifests/mia-seven-review-210-target-20260725.json"
              target_count="210"
              property_unit_count="252"
              ;;
            mia-seven-791-2280-ldareg-api-readonly-20260725)
              target_path="development-land-area-sync-manifests/mia-seven-791-2280-ldareg-api-readonly-target-20260725.json"
              target_count="1"
              property_unit_count="4"
              ;;
            mia-seven-full-278-official-components-api-readonly-production-20260812)
              # 운영 target 읽기 전용 캡처 — CLI 가 target 문서의 databaseTarget 으로
              # 접속 DB 를 고르므로 env 주입이 없다. 쓰기 창(enable)과 무관하게
              # landAreaSyncEnabled=false 게이트 아래에서만 돈다.
              target_path="development-land-area-sync-manifests/mia-seven-full-278-official-components-api-readonly-production-target-20260812.json"
              target_count="278"
              property_unit_count="422"
              ;;
            mia-seven-standard-267-api-readonly-production-20260812)
              # 표준 계약(DB_RESOLVER)으로 해석되는 267 anchor 부분집합 —
              # run 31556569354 실측에서 CAPTURED 267/스캔 268 PNU/물건 306 이
              # write-eligible 로 확인된 그 집합이다. REVIEW 11 anchor 는 제외.
              target_path="development-land-area-sync-manifests/mia-seven-standard-267-api-readonly-production-target-20260812.json"
              target_count="267"
              property_unit_count="306"
              ;;
            solsam-full-1086-api-readonly-production-20260904)
              # 삼양동(solsam) 운영 target 전수 읽기 전용 캡처 — REVIEW 집합 발견용.
              # 활성 필지 1,086 anchor 전수·활성 물건지 1,607. 쓰기 run 라벨(standard)
              # 은 이 캡처의 write-eligible 부분집합이 실증된 뒤에만 별도로 추가한다.
              target_path="development-land-area-sync-manifests/solsam-full-1086-api-readonly-production-target-20260904.json"
              target_count="1086"
              property_unit_count="1607"
              ;;
            solsam-standard-a-851-api-readonly-production-20260904)
              # 삼양동 창 A — 전수 캡처 run 33858451581 의 CAPTURED 975 에서
              # 감사 제외 51필지(편입<공부·비율형·병합 대지권·NULL·중복 identity)와
              # REVIEW/FAILED 111필지, MANUAL 출처 필지를 뺀 비-MANUAL 부분집합.
              target_path="development-land-area-sync-manifests/solsam-standard-a-851-api-readonly-production-target-20260904.json"
              target_count="851"
              property_unit_count="965"
              ;;
            solsam-standard-b-101-api-readonly-production-20260904)
              # 삼양동 창 B — 같은 제외 집합을 적용한 MANUAL 출처 필지 부분집합
              # (값은 land_lots 와 일치해 출처만 LADFRL/LDAREG 로 전환된다).
              target_path="development-land-area-sync-manifests/solsam-standard-b-101-api-readonly-production-target-20260904.json"
              target_count="101"
              property_unit_count="137"
              ;;
            solsam-g1-40-api-readonly-production-20260907)
              # 삼양동 잔여 134필지 중 G1 — 데이터 정정(건물 유닛 연결·dong 정규화·
              # 토토하우스 건물 분리, 2026-09-07) 뒤 canonical 재실행 대상 40 anchor(물건 75).
              # 명시 포함 목록(solsam-g1-40-include-20260907.json)으로만 생성했고
              # 제외 목록(solsam-exclude-standard-20260904.json) 의 부분집합이다.
              target_path="development-land-area-sync-manifests/solsam-g1-40-api-readonly-production-target-20260907.json"
              target_count="40"
              property_unit_count="75"
              ;;
            *)
              echo "::error::Target manifest is not repository-approved."
              exit 1
              ;;
          esac
          if [[ ! -f "${target_path}" || -L "${target_path}" ]]; then
            echo "::error::Approved target must be a regular file."
            exit 1
          fi
          target_size="$(stat -c '%s' "${target_path}")"
          if [[ "${target_size}" -lt 2 || "${target_size}" -gt 1048576 ]]; then
            echo "::error::Approved target size is invalid."
            exit 1
          fi
          EXPECTED_TARGET_COUNT="${target_count}" \
            EXPECTED_PROPERTY_UNIT_COUNT="${property_unit_count}" \
            node - "${target_path}" <<'NODE'
          const fs = require("node:fs");
          const {
            parseDevelopmentTargetManifest,
          } = require("./dist/operations/development-land-area-sync-runner.js");
          const target = parseDevelopmentTargetManifest(
            JSON.parse(fs.readFileSync(process.argv[2], "utf8"))
          );
          if (
            target.targetCount !== Number(process.env.EXPECTED_TARGET_COUNT)
            || target.expectedPropertyUnitCount !==
              Number(process.env.EXPECTED_PROPERTY_UNIT_COUNT)
          ) {
            process.exit(1);
          }
          NODE
          echo "target_path=${target_path}" >> "${GITHUB_OUTPUT}"

      - name: Configure pinned EC2 SSH identity
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_SSH_FINGERPRINT: ${{ secrets.EC2_SSH_FINGERPRINT }}
        run: |
          set -euo pipefail
          for variable_name in \
            EC2_HOST \
            EC2_USERNAME \
            EC2_SSH_KEY \
            EC2_SSH_FINGERPRINT
          do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::Missing required EC2 connection secret."
              exit 1
            fi
          done
          if [[ ! "${EC2_USERNAME}" =~ ^[a-z_][a-z0-9_-]*$ ]]; then
            echo "::error::EC2 username format is invalid."
            exit 1
          fi
          if [[
            ${#EC2_HOST} -gt 253
            || ! "${EC2_HOST}" =~ ^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$
          ]]; then
            echo "::error::EC2 host format is invalid."
            exit 1
          fi
          install -d -m 700 "${HOME}/.ssh"
          install -m 600 /dev/null "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${EC2_SSH_KEY}" > "${HOME}/.ssh/id_ed25519"
          host_keys="$(ssh-keyscan -T 10 -t ed25519,ecdsa,rsa "${EC2_HOST}" 2>/dev/null)"
          if [[ -z "${host_keys}" ]]; then
            echo "::error::EC2 host key scan returned no keys."
            exit 1
          fi
          matched_host_key=""
          while IFS= read -r host_key; do
            fingerprint="$(
              printf '%s\n' "${host_key}" \
                | ssh-keygen -lf - -E sha256 \
                | awk '{print $2}'
            )"
            if [[ "${fingerprint}" == "${EC2_SSH_FINGERPRINT}" ]]; then
              matched_host_key="${host_key}"
              break
            fi
          done <<< "${host_keys}"
          if [[ -z "${matched_host_key}" ]]; then
            echo "::error::EC2 SSH fingerprint mismatch."
            exit 1
          fi
          printf '%s\n' "${matched_host_key}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

      - name: Run read-only capture in exact deployed container
        id: remote
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          TARGET_PATH: ${{ steps.manifest.outputs.target_path }}
          RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
          CAPTURE_RUN_ID: ${{ github.run_id }}
          EXPECTED_GIT_SHA: ${{ github.sha }}
          EXPECTED_IMAGE_TAG: ghcr.io/dlswn666/alimtalk-proxy:${{ github.sha }}
        run: |
          set -Eeuo pipefail
          if [[
            ! "${RUN_KEY}" =~ ^[0-9]+-[0-9]+$
            || ! "${CAPTURE_RUN_ID}" =~ ^[1-9][0-9]*$
            || ! "${EXPECTED_GIT_SHA}" =~ ^[0-9a-f]{40}$
            || "${EXPECTED_IMAGE_TAG}" != "ghcr.io/dlswn666/alimtalk-proxy:${EXPECTED_GIT_SHA}"
          ]]; then
            echo "::error::Capture run identity is invalid."
            exit 1
          fi
          ssh_options=(
            -i "${HOME}/.ssh/id_ed25519"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=40
            -o "UserKnownHostsFile=${HOME}/.ssh/known_hosts"
          )
          remote_root="alimtalk-proxy/.development-land-area-evidence-workflow/${RUN_KEY}"
          local_root="development-land-area-evidence-output"
          mkdir -m 700 -- "${local_root}"
          cleanup_remote() {
            ssh "${ssh_options[@]}" "${EC2_USERNAME}@${EC2_HOST}" \
              "RUN_KEY='${RUN_KEY}' bash -s" <<'REMOTE_CLEANUP'
          set -euo pipefail
          run_root="${HOME}/alimtalk-proxy/.development-land-area-evidence-workflow/${RUN_KEY}"
          if [[ -d "${run_root}" && ! -L "${run_root}" ]]; then
            rm -f -- \
              "${run_root}/target.json" \
              "${run_root}/evidence.json" \
              "${run_root}/audit.json" \
              "${run_root}/status"
            rmdir -- "${run_root}"
          fi
          test ! -e "${run_root}"
          test ! -L "${run_root}"
          REMOTE_CLEANUP
          }
          finish_step() {
            local prior_status="$?"
            trap - EXIT
            if ! cleanup_remote; then
              echo "::error::Remote capture cleanup failed."
              exit 1
            fi
            exit "${prior_status}"
          }

          ssh "${ssh_options[@]}" "${EC2_USERNAME}@${EC2_HOST}" \
            "RUN_KEY='${RUN_KEY}' bash -s" <<'REMOTE_PREPARE'
          set -euo pipefail
          application_root="${HOME}/alimtalk-proxy"
          parent="${application_root}/.development-land-area-evidence-workflow"
          run_root="${parent}/${RUN_KEY}"
          test -d "${application_root}"
          test ! -L "${application_root}"
          if [[ -e "${parent}" || -L "${parent}" ]]; then
            test -d "${parent}"
            test ! -L "${parent}"
          else
            mkdir -m 700 -- "${parent}"
          fi
          chmod 700 "${parent}"
          (umask 077; mkdir -m 700 -- "${run_root}")
          REMOTE_PREPARE
          trap finish_step EXIT
          scp "${ssh_options[@]}" "${TARGET_PATH}" \
            "${EC2_USERNAME}@${EC2_HOST}:${remote_root}/target.json"

          ssh "${ssh_options[@]}" "${EC2_USERNAME}@${EC2_HOST}" \
            "RUN_KEY='${RUN_KEY}' CAPTURE_RUN_ID='${CAPTURE_RUN_ID}' EXPECTED_GIT_SHA='${EXPECTED_GIT_SHA}' EXPECTED_IMAGE_TAG='${EXPECTED_IMAGE_TAG}' bash -s" <<'REMOTE_CAPTURE'
          set -Eeuo pipefail
          umask 077
          application_root="${HOME}/alimtalk-proxy"
          run_root="${application_root}/.development-land-area-evidence-workflow/${RUN_KEY}"
          operation_lock_path="${application_root}/.land-area-sync-operation.lock"
          container_name="alimtalk-proxy"
          container_root="/tmp/.development-land-area-evidence-capture"
          container_target="${container_root}/target-${RUN_KEY}.json"
          container_evidence="${container_root}/evidence-${RUN_KEY}.json"
          container_audit="${container_root}/audit-${RUN_KEY}.json"
          host_target="${run_root}/target.json"
          host_evidence="${run_root}/evidence.json"
          host_audit="${run_root}/audit.json"
          host_status="${run_root}/status"
          target_container=""

          cleanup_container() {
            if [[ -n "${target_container}" ]]; then
              docker exec "${target_container}" rm -f -- \
                "${container_target}" \
                "${container_evidence}" \
                "${container_audit}" || true
            fi
          }
          finish_remote() {
            local prior_status="$?"
            trap - EXIT
            cleanup_container
            exit "${prior_status}"
          }
          trap finish_remote EXIT

          test -f "${operation_lock_path}"
          test ! -L "${operation_lock_path}"
          exec 9>>"${operation_lock_path}"
          flock -w 900 9
          test -f "${host_target}"
          test ! -L "${host_target}"
          chmod 600 "${host_target}"

          target_container="$(docker inspect --format '{{.Id}}' "${container_name}")"
          target_image_id="$(docker inspect --format '{{.Image}}' "${container_name}")"
          target_revision="$(
            docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
              "${target_image_id}"
          )"
          if [[
            ! "${target_container}" =~ ^[0-9a-f]{64}$
            || ! "${target_image_id}" =~ ^sha256:[0-9a-f]{64}$
            || "${target_revision}" != "${EXPECTED_GIT_SHA}"
          ]]; then
            exit 67
          fi

          health="$(
            docker exec "${target_container}" \
              node -e '
                const http = require("node:http");
                const request = http.get("http://127.0.0.1:3100/health", { timeout: 5000 }, (response) => {
                  let body = "";
                  response.setEncoding("utf8");
                  response.on("data", (chunk) => body += chunk);
                  response.on("end", () => process.stdout.write(body));
                });
                request.on("timeout", () => request.destroy());
                request.on("error", () => process.exit(1));
              '
          )"
          docker exec \
            -e HEALTH="${health}" \
            -e EXPECTED_GIT_SHA="${EXPECTED_GIT_SHA}" \
            -e EXPECTED_IMAGE_TAG="${EXPECTED_IMAGE_TAG}" \
            "${target_container}" node -e '
              const value = JSON.parse(process.env.HEALTH);
              if (
                value?.status !== "ok"
                || value?.gitSha !== process.env.EXPECTED_GIT_SHA
                || value?.imageTag !== process.env.EXPECTED_IMAGE_TAG
                || value?.features?.landAreaSyncEnabled !== false
                || value?.features?.landAreaSyncAllowedTargetCount !== 0
              ) process.exit(1);
            '

          docker exec "${target_container}" \
            install -d -m 700 "${container_root}"
          docker exec -i \
            -e PRIVATE_INPUT_PATH="${container_target}" \
            "${target_container}" \
            node -e '
              const fs = require("node:fs");
              const target = process.env.PRIVATE_INPUT_PATH;
              if (!/^\/tmp\/\.development-land-area-evidence-capture\/target-[0-9]+-[0-9]+\.json$/.test(target)) process.exit(1);
              const chunks = [];
              let size = 0;
              process.stdin.on("data", (chunk) => {
                size += chunk.length;
                if (size > 1048576) process.exit(1);
                chunks.push(chunk);
              });
              process.stdin.on("end", () => {
                fs.writeFileSync(target, Buffer.concat(chunks), { flag: "wx", mode: 0o600 });
              });
            ' < "${host_target}"

          set +e
          docker exec -w /tmp "${target_container}" \
            node /app/dist/cli/development-land-area-evidence-capture.js \
            --target ".development-land-area-evidence-capture/target-${RUN_KEY}.json" \
            --capture-run-id "${CAPTURE_RUN_ID}" \
            --evidence-out ".development-land-area-evidence-capture/evidence-${RUN_KEY}.json" \
            --audit-out ".development-land-area-evidence-capture/audit-${RUN_KEY}.json"
          capture_status="$?"
          set -e
          if docker exec "${target_container}" test -f "${container_audit}"; then
            docker cp "${target_container}:${container_audit}" "${host_audit}"
            chmod 600 "${host_audit}"
          fi
          if docker exec "${target_container}" test -f "${container_evidence}"; then
            docker cp "${target_container}:${container_evidence}" "${host_evidence}"
            chmod 600 "${host_evidence}"
          fi
          printf '%s\n' "${capture_status}" > "${host_status}"
          chmod 600 "${host_status}"
          cleanup_container
          trap - EXIT
          exit 0
          REMOTE_CAPTURE

          scp "${ssh_options[@]}" \
            "${EC2_USERNAME}@${EC2_HOST}:${remote_root}/status" \
            "${local_root}/status"
          if ssh "${ssh_options[@]}" "${EC2_USERNAME}@${EC2_HOST}" \
            "test -f '${remote_root}/audit.json'"
          then
            scp "${ssh_options[@]}" \
              "${EC2_USERNAME}@${EC2_HOST}:${remote_root}/audit.json" \
              "${local_root}/audit.json"
          fi
          if ssh "${ssh_options[@]}" "${EC2_USERNAME}@${EC2_HOST}" \
            "test -f '${remote_root}/evidence.json'"
          then
            scp "${ssh_options[@]}" \
              "${EC2_USERNAME}@${EC2_HOST}:${remote_root}/evidence.json" \
              "${local_root}/evidence.json"
          fi
          cleanup_remote
          trap - EXIT

      - name: Validate captured evidence
        id: validate
        shell: bash
        env:
          TARGET_PATH: ${{ steps.manifest.outputs.target_path }}
          CAPTURE_RUN_ID: ${{ github.run_id }}
          MANIFEST_LABEL: ${{ inputs.manifest }}
        run: |
          set -euo pipefail
          root="development-land-area-evidence-output"
          for candidate in \
            "${root}/status" \
            "${root}/audit.json"
          do
            if [[ ! -f "${candidate}" || -L "${candidate}" ]]; then
              echo "::error::Required capture output is missing."
              exit 1
            fi
          done
          status="$(tr -d '[:space:]' < "${root}/status")"
          if [[ "${status}" != "0" ]]; then
            echo "::error::Read-only capture did not pass."
            exit 1
          fi
          if [[ ! -f "${root}/evidence.json" || -L "${root}/evidence.json" ]]; then
            echo "::error::Captured evidence is missing."
            exit 1
          fi
          node - \
            "${TARGET_PATH}" \
            "${root}/evidence.json" \
            "${root}/audit.json" \
            "${CAPTURE_RUN_ID}" <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const {
            parseDevelopmentTargetManifest,
            parseDevelopmentEvidenceManifest,
            validateDevelopmentRunnerManifests,
          } = require("./dist/operations/development-land-area-sync-runner.js");
          const read = (file) => JSON.parse(fs.readFileSync(file, "utf8"));
          const target = parseDevelopmentTargetManifest(read(process.argv[2]));
          const evidence = parseDevelopmentEvidenceManifest(read(process.argv[3]));
          const approvedScopePnus = Array.isArray(target.allowedScopePnus)
            ? target.allowedScopePnus
            : target.pnus;
          const approvedScopeDigest = typeof target.scopeDigest === "string"
            ? target.scopeDigest
            : target.manifestDigest;
          const audit = read(process.argv[4]);
          const evidenceText = fs.readFileSync(process.argv[3], "utf8");
          const evidenceSha = crypto.createHash("sha256").update(evidenceText).digest("hex");
          const expectedSameRunOfficial =
            process.env.MANIFEST_LABEL ===
              "mia-seven-full-278-official-components-api-readonly-20260729";
          const exactFullRefreshComponentCoverage =
            audit?.verifiedNoDataCount === 0
            && audit?.sameRunOfficialComponentCount
              + audit?.sameRunOfficialParcelCount
            === target.targetCount;
          if (
            evidence.unionId !== target.unionId
            || evidence.manifestDigest !== target.manifestDigest
            || evidence.entries.length !== target.targetCount
            || new Set(evidence.entries.flatMap((entry) => entry.expectedPropertyUnitIds)).size
              !== target.expectedPropertyUnitCount
            || audit?.version !== "land-area-development-evidence-capture-audit@3"
            || audit?.captureRunId !== process.argv[5]
            || audit?.gate?.status !== "PASS"
            || audit?.readOnlyGuards?.durableSyncJobWrites !== 0
            || audit?.readOnlyGuards?.propertyUnitWriteRpcCalls !== 0
            || audit?.evidenceManifestSha256 !== evidenceSha
            || audit?.activePnuCount !== target.expectedUnionActivePnuCount
            || (
              target.version === "land-area-development-target-manifest@3"
              && audit?.activePnuDigest !== target.expectedUnionActivePnuDigest
            )
            || audit?.activePropertyIdentityStable !== true
            || audit?.initialActivePropertyIdentityDigest !==
              audit?.finalActivePropertyIdentityDigest
            || audit?.resolvedComponentCount !== target.targetCount
            || audit?.scannedPnuCount !== approvedScopePnus.length
          ) process.exit(1);
          const dbApproval = {
            version: "land-area-development-db-approval-manifest@1",
            // 합성 approval 은 target 문서의 환경을 그대로 따른다 — 러너 교차검증이
            // approval.databaseTarget === target.databaseTarget 을 exact 요구한다.
            databaseTarget: target.databaseTarget,
            unionId: target.unionId,
            pnus: approvedScopePnus,
            targetCount: approvedScopePnus.length,
            manifestDigest: approvedScopeDigest,
            enabled: true,
          };
          if (expectedSameRunOfficial) {
            if (
              !exactFullRefreshComponentCoverage
              || audit?.promotionGate?.status !== "PASS"
              || audit?.promotionGate?.writeEligible !== true
              || audit?.promotionGate?.failureCodes?.length !== 0
            ) process.exit(1);
            validateDevelopmentRunnerManifests(
              target,
              dbApproval,
              evidence
            );
          } else {
            if (
              audit?.sameRunOfficialComponentCount !== 0
              || audit?.sameRunOfficialParcelCount !== 0
              || audit?.verifiedNoDataCount !== 0
              || audit?.promotionGate?.status !== "PASS"
              || audit?.promotionGate?.writeEligible !== true
              || audit?.promotionGate?.failureCodes?.length !== 0
            ) process.exit(1);
            validateDevelopmentRunnerManifests(
              target,
              dbApproval,
              evidence
            );
          }
          NODE
          sha256sum \
            "${root}/evidence.json" \
            "${root}/audit.json" \
            > "${root}/sha256sums.txt"

      - name: Build sanitized read-only capture artifact
        if: always() && hashFiles('development-land-area-evidence-output/audit.json') != ''
        shell: bash
        env:
          MANIFEST_LABEL: ${{ inputs.manifest }}
        run: |
          set -euo pipefail
          private_root="development-land-area-evidence-output"
          public_root="development-land-area-evidence-public"
          install -d -m 700 "${public_root}"
          node - \
            "${private_root}/audit.json" \
            "${private_root}/status" \
            "${private_root}/evidence.json" \
            "${public_root}/artifact.json" \
            "${MANIFEST_LABEL}" <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const [auditPath, statusPath, evidencePath, outputPath, manifestLabel] =
            process.argv.slice(2);
          const auditText = fs.readFileSync(auditPath, "utf8");
          const audit = JSON.parse(auditText);
          const statusText = fs.existsSync(statusPath)
            ? fs.readFileSync(statusPath, "utf8").trim()
            : "";
          const evidenceText = fs.existsSync(evidencePath)
            ? fs.readFileSync(evidencePath, "utf8")
            : null;
          const hex64 = /^[0-9a-f]{64}$/;
          const safeCode =
            /^(?!.*[0-9]{19})[A-Z0-9_]{1,100}$/;
          const aggregateKeys = ["CAPTURED", "NO_DATA", "REVIEW", "FAILED"];
          const guardKeys = [
            "durableSyncJobWrites",
            "propertyUnitWriteRpcCalls",
            "interceptedApplyRpcCalls",
            "interceptedSnapshotWrites",
            "interceptedTerminalWrites",
            "interceptedFailureWrites",
          ];
          const strategyValues = new Set(["LADFRL", "LDAREG"]);
          const resolutionSourceValues = new Set([
            "DB_RESOLVER",
            "SAME_RUN_OFFICIAL_READ_ONLY",
            "SAME_RUN_OFFICIAL_DEVELOPMENT_FULL_REFRESH",
            "SAME_RUN_OFFICIAL_DEVELOPMENT_PARCEL_SINGLETON",
            "VERIFIED_NO_DATA",
          ]);
          const retrySkippedValues = new Set([
            "NONE",
            "TOO_MANY_FAILURES",
          ]);
          const optionalSafeCode = (value) =>
            value === null
            || (typeof value === "string" && safeCode.test(value));
          const failureDetailsValid =
            Array.isArray(audit?.entries)
            && audit.entries.length === audit.targetCount
            && audit.entries.every(
              (entry) =>
                entry
                && typeof entry === "object"
                && !Array.isArray(entry)
                && ["CAPTURED", "VERIFIED_NO_DATA", "FAILED"].includes(entry.status)
                && (
                  entry.strategy === null
                  || strategyValues.has(entry.strategy)
                )
                && Number.isSafeInteger(entry.scannedPnuCount)
                && entry.scannedPnuCount >= 0
                && Number.isSafeInteger(entry.propertyUnitCount)
                && entry.propertyUnitCount >= 0
                && optionalSafeCode(entry.failureCode)
                && optionalSafeCode(entry.terminalScopeState)
                && optionalSafeCode(entry.terminalOutcome)
                && Array.isArray(entry.terminalIssueCodes)
                && new Set(entry.terminalIssueCodes).size
                  === entry.terminalIssueCodes.length
                && entry.terminalIssueCodes.every(
                  (code) =>
                    typeof code === "string" && safeCode.test(code)
                )
                && Number.isSafeInteger(entry.terminalIssuesTotal)
                && entry.terminalIssuesTotal >= 0
                && typeof entry.terminalIssuesTruncated === "boolean"
                && resolutionSourceValues.has(
                  entry.scopeResolutionSource
                )
                && Number.isSafeInteger(entry.attempts)
                && entry.attempts >= 0
            );
          const issueCountsValid =
            Array.isArray(audit?.redactedIssueCounts)
            && new Set(
              audit.redactedIssueCounts.map((row) => row?.code)
            ).size === audit.redactedIssueCounts.length
            && audit.redactedIssueCounts.every(
              (row) =>
                row
                && typeof row === "object"
                && !Array.isArray(row)
                && JSON.stringify(Object.keys(row).sort()) ===
                  JSON.stringify(["code", "count"])
                && typeof row.code === "string"
                && safeCode.test(row.code)
                && Number.isSafeInteger(row.count)
                && row.count > 0
            );
          if (
            audit?.version !== "land-area-development-evidence-capture-audit@3"
            || !["development", "production"].includes(audit?.databaseTarget)
            || typeof manifestLabel !== "string"
            || !/^[a-z0-9-]{1,100}$/.test(manifestLabel)
            || !Number.isSafeInteger(audit.targetCount)
            || audit.targetCount < 0
            || !Number.isSafeInteger(audit.expectedPropertyUnitCount)
            || audit.expectedPropertyUnitCount < 0
            || !Number.isSafeInteger(audit.activePnuCount)
            || audit.activePnuCount < 0
            || typeof audit.activePnuDigest !== "string"
            || !hex64.test(audit.activePnuDigest)
            || typeof audit.initialActivePropertyIdentityDigest !== "string"
            || !hex64.test(audit.initialActivePropertyIdentityDigest)
            || typeof audit.finalActivePropertyIdentityDigest !== "string"
            || !hex64.test(audit.finalActivePropertyIdentityDigest)
            || typeof audit.activePropertyIdentityStable !== "boolean"
            || !Number.isSafeInteger(audit.resolvedComponentCount)
            || audit.resolvedComponentCount < 0
            || !Number.isSafeInteger(audit.scannedPnuCount)
            || audit.scannedPnuCount < 0
            || !Number.isSafeInteger(audit.sameRunOfficialComponentCount)
            || audit.sameRunOfficialComponentCount < 0
            || !Number.isSafeInteger(audit.sameRunOfficialParcelCount)
            || audit.sameRunOfficialParcelCount < 0
            || !Number.isSafeInteger(audit.verifiedNoDataCount)
            || audit.verifiedNoDataCount < 0
            || typeof audit.manifestDigest !== "string"
            || !hex64.test(audit.manifestDigest)
            || !failureDetailsValid
            || !audit.redactedAggregate
            || !issueCountsValid
            || aggregateKeys.some(
              (key) =>
                !Number.isSafeInteger(audit.redactedAggregate[key])
                || audit.redactedAggregate[key] < 0
            )
            || !audit.readOnlyGuards
            || guardKeys.some(
              (key) =>
                !Number.isSafeInteger(audit.readOnlyGuards[key])
                || audit.readOnlyGuards[key] < 0
            )
            || !audit.gate
            || !["PASS", "FAIL"].includes(audit.gate.status)
            || !Array.isArray(audit.gate.failureCodes)
            || audit.gate.failureCodes.some(
              (code) => typeof code !== "string" || !safeCode.test(code)
            )
            || !audit.promotionGate
            || !["PASS", "BLOCKED"].includes(audit.promotionGate.status)
            || typeof audit.promotionGate.writeEligible !== "boolean"
            || !Array.isArray(audit.promotionGate.failureCodes)
            || audit.promotionGate.failureCodes.some(
              (code) => typeof code !== "string" || !safeCode.test(code)
            )
            || !audit.retry
            || !Number.isSafeInteger(audit.retry.rounds)
            || audit.retry.rounds < 0
            || !Number.isSafeInteger(audit.retry.retriedAnchorCount)
            || audit.retry.retriedAnchorCount < 0
            || !Number.isSafeInteger(audit.retry.recoveredAnchorCount)
            || audit.retry.recoveredAnchorCount < 0
            || !retrySkippedValues.has(audit.retry.skipped)
            || !/^[0-9]+$/.test(statusText)
          ) process.exit(1);
          const classifyFailure = (entry) =>
            entry.terminalOutcome === "NO_DATA"
              ? "NO_DATA"
              : (
                entry.terminalOutcome === "REVIEW_REQUIRED"
                || entry.terminalScopeState === "REVIEW_REQUIRED"
              )
                ? "REVIEW"
                : "FAILED";
          const redactedFailureDetails = audit.entries.flatMap(
            (entry, index) =>
              entry.status === "CAPTURED"
                ? []
                : [{
                    targetOrdinal: index + 1,
                    result: classifyFailure(entry),
                    strategy: entry.strategy,
                    scannedScopeCount: entry.scannedPnuCount,
                    propertyCount: entry.propertyUnitCount,
                    failureCode: entry.failureCode,
                    scopeState: entry.terminalScopeState,
                    terminalOutcome: entry.terminalOutcome,
                    issueCodes: [...entry.terminalIssueCodes].sort(),
                    issuesTotal: entry.terminalIssuesTotal,
                    issuesTruncated: entry.terminalIssuesTruncated,
                    resolutionSource: entry.scopeResolutionSource,
                    attempts: entry.attempts,
                  }]
          );
          for (const result of ["NO_DATA", "REVIEW", "FAILED"]) {
            if (
              redactedFailureDetails.filter(
                (detail) => detail.result === result
              ).length !== audit.redactedAggregate[result]
            ) process.exit(1);
          }
          const sha256 = (value) =>
            crypto.createHash("sha256").update(value).digest("hex");
          const optionalHex = (value) =>
            typeof value === "string" && hex64.test(value) ? value : null;
          const artifact = {
            version: "land-area-development-evidence-public-artifact@4",
            databaseTarget: audit.databaseTarget,
            manifestLabel,
            manifestDigest: audit.manifestDigest,
            targetCount: audit.targetCount,
            expectedPropertyUnitCount: audit.expectedPropertyUnitCount,
            activePnuCount: audit.activePnuCount,
            activePnuDigest: audit.activePnuDigest,
            initialActivePropertyIdentityDigest:
              audit.initialActivePropertyIdentityDigest,
            finalActivePropertyIdentityDigest:
              audit.finalActivePropertyIdentityDigest,
            activePropertyIdentityStable:
              audit.activePropertyIdentityStable,
            resolvedComponentCount: audit.resolvedComponentCount,
            scannedPnuCount: audit.scannedPnuCount,
            sameRunOfficialComponentCount:
              audit.sameRunOfficialComponentCount,
            sameRunOfficialParcelCount:
              audit.sameRunOfficialParcelCount,
            verifiedNoDataCount: audit.verifiedNoDataCount,
            entryCount: audit.entries.length,
            capturedEvidencePropertyUnitCount:
              Number.isSafeInteger(audit.capturedEvidencePropertyUnitCount)
                ? audit.capturedEvidencePropertyUnitCount
                : 0,
            redactedAggregate: Object.fromEntries(
              aggregateKeys.map((key) => [key, audit.redactedAggregate[key]])
            ),
            redactedIssueCounts: audit.redactedIssueCounts.map((row) => ({
              code: row.code,
              count: row.count,
            })),
            redactedFailureDetails,
            retry: {
              rounds: audit.retry.rounds,
              retriedAnchorCount: audit.retry.retriedAnchorCount,
              recoveredAnchorCount: audit.retry.recoveredAnchorCount,
              skipped: audit.retry.skipped,
            },
            readOnlyGuards: Object.fromEntries(
              guardKeys.map((key) => [key, audit.readOnlyGuards[key]])
            ),
            gate: {
              status: audit.gate.status,
              failureCodes: [...audit.gate.failureCodes].sort(),
            },
            promotionGate: {
              status: audit.promotionGate.status,
              writeEligible: audit.promotionGate.writeEligible,
              failureCodes:
                [...audit.promotionGate.failureCodes].sort(),
            },
            captureExitStatus: Number(statusText),
            hashes: {
              rawAuditSha256: sha256(auditText),
              rawEvidenceFileSha256:
                evidenceText === null ? null : sha256(evidenceText),
              capturedEvidenceManifestSha256:
                optionalHex(audit.capturedEvidenceManifestSha256),
              evidenceManifestSha256:
                optionalHex(audit.evidenceManifestSha256),
            },
            productionWrites: 0,
          };
          const serialized = `${JSON.stringify(artifact, null, 2)}\n`;
          if (
            /[0-9]{19}/.test(manifestLabel)
            || /\b[0-9]{19}\b/.test(serialized)
            || /[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i.test(serialized)
            || /anchorPnu|propertyUnitId|allowedPrestates|proposedLandAreas|landArea/i.test(serialized)
          ) process.exit(1);
          fs.writeFileSync(outputPath, serialized, {
            flag: "wx",
            mode: 0o600,
          });
          NODE

      - name: Upload sanitized read-only capture artifact
        if: always() && hashFiles('development-land-area-evidence-public/artifact.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: development-land-area-evidence-summary-${{ inputs.manifest }}-${{ github.run_id }}
          path: development-land-area-evidence-public/artifact.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce capture gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="development-land-area-evidence-output"
          if [[
            ! -f "${root}/status"
            || ! -f "${root}/audit.json"
            || ! -f "${root}/evidence.json"
            || ! -f "${root}/sha256sums.txt"
          ]]; then
            echo "::error::Validated evidence capture output is incomplete."
            exit 1
          fi
          if [[ "$(tr -d '[:space:]' < "${root}/status")" != "0" ]]; then
            echo "::error::Development evidence capture gate did not pass."
            exit 1
          fi
          gate="$(
            node -e '
              const fs = require("node:fs");
              const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              process.stdout.write(String(value?.gate?.status ?? ""));
            ' "${root}/audit.json"
          )"
          if [[ "${gate}" != "PASS" ]]; then
            echo "::error::Development evidence audit gate did not pass."
            exit 1
          fi

      - name: Remove private capture files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="development-land-area-evidence-output"
          if [[ -e "${root}" || -L "${root}" ]]; then
            if [[ ! -d "${root}" || -L "${root}" ]]; then
              echo "::error::Private capture output root is invalid."
              exit 1
            fi
            for candidate in \
            "${root}/status" \
            "${root}/audit.json" \
            "${root}/evidence.json" \
            "${root}/sha256sums.txt"
            do
              if [[ -e "${candidate}" || -L "${candidate}" ]]; then
                if [[ ! -f "${candidate}" || -L "${candidate}" ]]; then
                  echo "::error::Private capture output file is invalid."
                  exit 1
                fi
                rm -f -- "${candidate}"
              fi
            done
            rmdir -- "${root}"
          fi
          test ! -e "${root}"
          test ! -L "${root}"
